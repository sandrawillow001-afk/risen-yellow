[workspace]
resolver = "2"
members = [
  "contracts/*",
]

[workspace.package]
authors = ["sandrawillow001-afk <sandrawillow001@gmail.com>"]
homepage = "https://github.com/sandrawillow001-afk/risen-yellow"
repository = "https://github.com/sandrawillow001-afk/risen-yellow"
edition = "2021"
license = "MIT"

[workspace.dependencies]
soroban-sdk = "23"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
